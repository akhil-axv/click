<!DOCTYPE html>
<html lang="kaa">
<head>
    <meta charset="UTF-8">
    <style>
        body { display: flex; justify-content: center; padding-top: 50px; background: #f0f0f0; }
        .svetofor-box {
            width: 80px;
            padding: 15px;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            border: solid;
            border-width: 5px
        }
        .btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 1px solid white;
            cursor: pointer;
        }
        .red { background: #0004ff; }
        .yellow { background: #ffcc00; }
        .green { background: #cc2e2e; }
        .input-area { display: none; flex-direction: column; gap: 5px; }
        input {
            width: 60px;
            padding: 4px;
            font-size: 11px;
            border: 1px solid #ccc;
            border-radius: 3px;
        }
        .send-btn {
            background: #3498db;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 10px;
            padding: 4px;
        }
    </style>
</head>
<body>

<div class="svetofor-box">
    <div id="item1">
        <button id="btn1" class="btn red" onclick="toggle(1)"></button>
        <div id="in1" class="input-area">
            <input type="text" placeholder="Jazıń...">
            <button class="send-btn" onclick="remove(1)">Jiberiw</button>
        </div>
    </div>

    <div id="item2">
        <button id="btn2" class="btn yellow" onclick="toggle(2)"></button>
        <div id="in2" class="input-area">
            <input type="text" placeholder="Jazıń...">
            <button class="send-btn" onclick="remove(2)">Jiberiw</button>
        </div>
    </div>

    <div id="item3">
        <button id="btn3" class="btn green" onclick="toggle(3)"></button>
        <div id="in3" class="input-area">
            <input type="text" placeholder="Jazıń...">
            <button class="send-btn" onclick="remove(3)">Jiberiw</button>
        </div>
    </div>
</div>

<script>
    function toggle(id) {
        document.getElementById('btn' + id).style.display = 'none';
        document.getElementById('in' + id).style.display = 'flex';
    }
    function remove(id) {
        document.getElementById('item' + id).style.display = 'none';
    }
</script>

</body>
</html>
